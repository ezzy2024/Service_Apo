<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apotheke Dashboard - ServiceApotheke</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a237e; --primary-light: #e8eaf6; --secondary: #26a269; --danger: #c01c28; --warning: #f5a623; --gray-light: #f8f9fa; --gray-border: #e9ecef; --text-dark: #2c3e50; --text-light: #6c757d; --shadow: 0 4px 12px rgba(0,0,0,0.08); --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--gray-light); color: var(--text-dark); display: flex; min-height: 100vh; overflow-x: hidden; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 350px; width: 100%; }
        .toast { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; border-left: 4px solid var(--secondary); transition: 0.3s; }
        .toast.error { border-left-color: var(--danger); color: var(--danger); }
        .sidebar { width: 280px; background: var(--primary); color: white; position: fixed; height: 100vh; padding: 20px 10px; z-index: 1000; transition: 0.3s; }
        .sidebar-header { margin-bottom: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .nav-item { padding: 15px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; display: flex; align-items: center; gap: 15px; font-weight: 500; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); }
        .main-content { margin-left: 280px; padding: 30px; flex: 1; transition: 0.3s; }
        .header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--gray-border); }
        .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); display: flex; align-items: center; gap: 15px; }
        .stat-icon { font-size: 24px; padding: 15px; border-radius: 50%; color: white; }
        .bg-blue { background: var(--primary); } .bg-green { background: var(--secondary); }
        .section { display: none; background: white; padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .section.active { display: block; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--gray-border); border-radius: 8px; margin-bottom: 15px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; background: var(--primary); color: white; font-weight: bold; }
        .btn-danger { background: var(--danger); }
        .job-card { border: 1px solid var(--gray-border); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        @media (max-width: 992px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h3>Apotheke Dashboard</h3></div>
        <div class="nav-item active" onclick="showSection('dashboard')"><i class="fas fa-home"></i> Übersicht</div>
        <div class="nav-item" onclick="showSection('create')"><i class="fas fa-plus"></i> Schicht erstellen</div>
        <div class="nav-item" onclick="showSection('shifts')"><i class="fas fa-list"></i> Meine Schichten</div>
        <div class="nav-item" onclick="logout()" style="margin-top: 50px; background: rgba(255,0,0,0.2);"><i class="fas fa-sign-out-alt"></i> Abmelden</div>
    </div>
    <div class="main-content">
        <div class="header">
            <h1 id="pharmacyName">Apotheke</h1>
        </div>
        <div class="stats-cards">
            <div class="stat-card"><div class="stat-icon bg-blue"><i class="fas fa-calendar"></i></div><div><h3 id="statTotal">0</h3><p>Gesamtschichten</p></div></div>
            <div class="stat-card"><div class="stat-icon bg-green"><i class="fas fa-check"></i></div><div><h3 id="statActive">0</h3><p>Aktive Schichten</p></div></div>
        </div>

        <div id="section-dashboard" class="section active">
            <h2>Übersicht</h2>
            <p>Willkommen im Dashboard. Erstellen Sie neue Schichten über die Seitenleiste.</p>
        </div>

        <div id="section-create" class="section">
            <h2>Neue Schicht erstellen</h2>
            <form id="shiftForm">
                <input type="date" id="sDate" class="form-control" required>
                <input type="time" id="sStart" class="form-control" value="08:00" required>
                <input type="time" id="sEnd" class="form-control" value="16:00" required>
                <input type="number" id="sSalary" class="form-control" placeholder="Gehalt (€)" required>
                <button type="submit" class="btn">Schicht veröffentlichen</button>
            </form>
        </div>

        <div id="section-shifts" class="section">
            <h2>Meine Schichten</h2>
            <button class="btn" onclick="loadShifts()" style="margin-bottom:15px;">Aktualisieren</button>
            <div id="shiftsList"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://serviceapotheke-api-830781040278.europe-west3.run.app/api";
        const token = localStorage.getItem('userToken');
        const pharmacyId = localStorage.getItem('userId');

        if (!token || !pharmacyId) window.location.href = "login.html";

        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerText = msg;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(`section-${id}`).classList.add('active');
            if (id === 'shifts') loadShifts();
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }

        document.getElementById('shiftForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                pharmacyId: parseInt(pharmacyId),
                requestType: "Vertretung", 
                urgency: "Normal",
                startDate: document.getElementById('sDate').value,
                endDate: document.getElementById('sDate').value,
                startTime: document.getElementById('sStart').value + ":00",
                endTime: document.getElementById('sEnd').value + ":00",
                softwareSystem: "Nicht angegeben",
                focusAreas: "Allgemein",
                salary: document.getElementById('sSalary').value,
                accommodation: "Nein",
                billingByInvoice: false,
                parkingAvailable: false,
                notes: "",
                status: "Active"
            };

            try {
                const response = await fetch(`${API_URL}/Job`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    showToast("Erfolgreich erstellt");
                    e.target.reset();
                    loadShifts();
                } else {
                    showToast("Validierungsfehler", true);
                }
            } catch { showToast("Netzwerkfehler", true); }
        });

        async function loadShifts() {
            try {
                const response = await fetch(`${API_URL}/Job/pharmacy/${pharmacyId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const shifts = await response.json();
                document.getElementById('statTotal').innerText = shifts.length;
                document.getElementById('statActive').innerText = shifts.filter(s=>s.status==="Active").length;
                
                const container = document.getElementById('shiftsList');
                container.innerHTML = shifts.map(s => `
                    <div class="job-card">
                        <strong>Datum:</strong> ${new Date(s.startDate).toLocaleDateString()} <br>
                        <strong>Zeit:</strong> ${s.startTime} - ${s.endTime} <br>
                        <strong>Gehalt:</strong> ${s.salary}€ <br>
                        <strong>Status:</strong> ${s.status}
                    </div>
                `).join('') || "Keine Schichten vorhanden.";
            } catch { showToast("Fehler beim Laden", true); }
        }
        loadShifts();
    </script>
</body>
</html>
